n_features: 30

train_dataset: GSE39004_trasp_mod.csv
test_dataset: GSE86374_trasp_mod.csv

models:
  SVM:
    batch_size: 8
    num_epochs: 100
    learningRate: 0.0001

  MLP:
    hidden_dim: 100
    batch_size: 8
    num_epochs: 100
    learningRate: 0.0001
    optimizer: Adam
    weight_decay: 0.01
  
  CNN-1D:
    batch_size: 8
    num_epochs: 100
    learningRate: 0.0001
    optimizer: Adam
    weight_decay: 0.01

  BaseKAN:
    hidden_dim: 32
    batch_size: 32
    num_epochs: 50
    learningRate: 0.001
    optimizer: Adam

  EfficientKAN:
    hidden_dim: 32
    batch_size: 32
    num_epochs: 50
    learningRate: 0.001
    optimizer: Adam

  FourierKAN:
    hidden_dim: 32
    batch_size: 32
    num_epochs: 50
    learningRate: 0.001
    optimizer: Adam

  IT-KAN:
    hidden_dim: 100
    grid_size: 9
    spline_order: 3 
    alpha: 1.0
    beta: 1.0
    sigma: 1.0
    k: 16
    batch_size: 8
    num_epochs: 100
    learningRate: 0.0001
    optimizer: Adam
    weight_decay: 0.01

  DI-CNN+:
    batch_size: 30
    num_epochs: 100
    learningRate: 0.0001
    optimizer: AdamW
    weight_decay: 0.01





